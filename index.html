<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sara Kinder | Links</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Bakgrunns-effekt */
        .bg-animate {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a0a 100%);
        }

        .blob {
            position: absolute;
            width: 350px;
            height: 350px;
            background: linear-gradient(135deg, #ff0050 0%, #5865F2 100%);
            filter: blur(90px);
            border-radius: 50%;
            opacity: 0.15;
            animation: move 25s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-20%, -20%); }
            to { transform: translate(30%, 30%); }
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 40px 20px;
            text-align: center;
        }

        .profile-header img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #ff0050;
            margin-bottom: 15px;
            object-fit: cover;
            box-shadow: 0 0 25px rgba(255, 0, 80, 0.5);
        }

        h1 { font-size: 28px; margin-bottom: 5px; font-weight: 800; }
        .subtitle { font-size: 14px; opacity: 0.5; margin-bottom: 35px; letter-spacing: 1px; }

        .links { display: flex; flex-direction: column; gap: 14px; }

        .link-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(12px);
        }

        .link-item i { font-size: 20px; width: 35px; text-align: left; }

        .link-item:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-3px);
            border-color: #00f2ea;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        /* Ikon-farger */
        .fa-instagram { color: #E1306C; }
        .fa-tiktok { color: #00f2ea; }
        .fa-youtube { color: #FF0000; }
        .fa-snapchat { color: #FFFC00; }
        .fa-discord { color: #5865F2; }
        .fa-x-twitter { color: #ffffff; }
        .fa-camera-retro { color: #ffffff; opacity: 0.8; }

        footer { margin-top: 50px; font-size: 10px; opacity: 0.3; letter-spacing: 3px; }
    </style>
</head>
<body>
    <div class="bg-animate"><div class="blob"></div></div>

    <div class="container">
        <div class="profile-header">
            <img src="sarakinder.jpg" alt="Sara Kinder">
            <h1>Sara Kinder</h1>
            <p class="subtitle">FØLG MEG PÅ ALLE SOSIALE MEDIER ✨</p>
        </div>

        <div class="links">
            <a href="https://www.instagram.com/sara_kinder5/" class="link-item" target="_blank">
                <i class="fab fa-instagram"></i> Instagram
            </a>
            
            <a href="https://www.tiktok.com/@sara_kinder5" class="link-item" target="_blank">
                <i class="fab fa-tiktok"></i> TikTok
            </a>

            <a href="https://www.youtube.com/@Sara_kinder" class="link-item" target="_blank">
                <i class="fab fa-youtube"></i> YouTube Main
            </a>

            <a href="https://www.youtube.com/@sara_KinderVODS" class="link-item" target="_blank">
                <i class="fas fa-video"></i> YouTube VODS
            </a>

            <a href="https://snapchat.com/t/Km3DGO3o" class="link-item" target="_blank">
                <i class="fab fa-snapchat"></i> Snapchat
            </a>

            <a href="https://discord.gg/7pF2n9WHmG" class="link-item" target="_blank">
                <i class="fab fa-discord"></i> Discord Server
            </a>

            <a href="https://x.com/horpestad_sara?s=21" class="link-item" target="_blank">
                <i class="fab fa-x-twitter"></i> X / Twitter
            </a>

            <a href="https://vs.co/mugpttvl" class="link-item" target="_blank">
                <i class="fas fa-camera-retro"></i> VSCO
            </a>
        </div>

        <footer>Made by M00RTEN &copy; 2026</footer>
    </div>
</body>
</html>
