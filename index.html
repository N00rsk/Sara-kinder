<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sara Kinder | Socials</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0a0a0a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-animate {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a0a 100%);
        }

        .blob {
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #ff0050 0%, #5865F2 100%);
            filter: blur(80px);
            border-radius: 50%;
            opacity: 0.2;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-10%, -10%); }
            to { transform: translate(20%, 20%); }
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 40px 20px;
            text-align: center;
        }

        .profile-header img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #ff0050;
            margin-bottom: 20px;
            object-fit: cover; /* Gjør at bildet ikke blir strukket */
            box-shadow: 0 0 20px rgba(255, 0, 80, 0.4);
        }

        h1 { font-size: 26px; margin-bottom: 8px; font-weight: 800; letter-spacing: -0.5px; }
        .subtitle { font-size: 15px; opacity: 0.6; margin-bottom: 32px; }

        .links { display: flex; flex-direction: column; gap: 16px; }

        .link-item {
            display: flex;
            align-items: center;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .link-item i { font-size: 20px; width: 32px; margin-right: 12px; }

        .link-item:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(1.02);
            border-color: #00f2ea;
        }

        .fa-instagram { color: #E1306C; }
        .fa-tiktok { color: #00f2ea; }
        .fa-youtube { color: #FF0000; }
        .fa-snapchat { color: #FFFC00; }
        .fa-discord { color: #5865F2; }

        footer { margin-top: 40px; font-size: 12px; opacity: 0.3; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div class="bg-animate"><div class="blob"></div></div>

    <div class="container">
        <div class="profile-header">
            <img src="sarakinder.jpg" alt="Sara Kinder">
            <h1>Sara Kinder</h1>
            <p class="subtitle">Følg meg overalt ✨</p>
        </div>

        <div class="links">
            <a href="https://www.instagram.com/sara_kinder5/" class="link-item" target="_blank">
                <i class="fab fa-instagram"></i> Instagram
            </a>
            <a href="https://www.tiktok.com/@sara_kinder5" class="link-item" target="_blank">
                <i class="fab fa-tiktok"></i> TikTok
            </a>
            <a href="https://www.youtube.com/@Sara_kinder" class="link-item" target="_blank">
                <i class="fab fa-youtube"></i> YouTube
            </a>
            <a href="https://www.youtube.com/@sara_KinderVODS" class="link-item" target="_blank">
                <i class="fas fa-play-circle"></i> YouTube VODS
            </a>
            <a href="https://snapchat.com/t/Km3DGO3o" class="link-item" target="_blank">
                <i class="fab fa-snapchat"></i> Snapchat
            </a>
            <a href="https://discord.gg/4xXkjcWQ" class="link-item" target="_blank">
                <i class="fab fa-discord"></i> Discord Server
            </a>
        </div>

        <footer>&copy; 2026 SARA KINDER</footer>
    </div>
</body>
</html>
